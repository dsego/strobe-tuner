<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Strobie phase hops</title>
  <desc id="desc">One display frame of a track. The reference oscillator runs on the absolute sample clock. The frame's new samples are measured a hop apart, a quarter of the note's period: each hop runs the single-bin DFT over a gamma window ending at the hop and rotates it back by the reference at the window's start, giving a phase against the reference. The frame's advance is the sum of the wrapped steps between the hops, which telescopes to the newest phase minus the previous frame's plus the full turns in between: four steps of 100 degrees count one full turn, 400 degrees. Measured once a frame, the same advance wraps to 40 degrees, the full turn is lost.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111; }
    .bg { fill: #fff; }
    .frame { fill: #fff; stroke: #222; stroke-width: 1; }
    .tab { font-size: 12px; font-weight: 600; }
    .row { font-size: 11px; font-style: italic; fill: #666; }
    .sub { font-size: 11px; fill: #444; }
    .label { font-size: 12px; }
    .math { font-size: 13px; font-family: "Menlo", "Consolas", monospace; }
    .wave { fill: none; stroke: #222; stroke-width: 1.2; }
    .input { stroke: #888; }
    .axis { stroke: #222; stroke-width: 1; }
    .tick { stroke: #222; stroke-width: 1; }
    .guide { stroke: #999; stroke-width: 1; stroke-dasharray: 4 4; }
    .start { stroke: #bbb; stroke-width: 1; stroke-dasharray: 2 3; }
    .window { fill: #fff; stroke: #222; stroke-width: 1; }
    .window.prev { stroke-dasharray: 4 3; stroke: #888; }
    .gamma { fill: #ddd; stroke: none; }
    .dot { fill: #222; }
    .dial { fill: #fff; stroke: #222; stroke-width: 1; }
    .needle { stroke: #222; stroke-width: 2; stroke-linecap: round; }
    .ghost { stroke: #aaa; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .zero { stroke: #222; stroke-width: 1; }
    .wire { fill: none; stroke: #222; stroke-width: 1; }
    .wrong { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 5 4; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#222" stroke-width="1"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#888" stroke-width="1"/>
    </marker>
    <clipPath id="buffer">
      <rect x="100" y="60" width="800" height="110"/>
    </clipPath>
  </defs>

  <rect class="bg" width="1100" height="600"/>

  <!-- The buffer on the sample clock -->
  <rect class="frame" x="10" y="30" width="1080" height="310"/>
  <path class="frame" d="M10,30 H322 V42 L314,50 H10 Z"/>
  <text class="tab" x="18" y="45">a track's buffer, on the absolute sample clock</text>

  <line class="axis" x1="100" y1="70" x2="900" y2="70" marker-end="url(#arrow)"/>
  <line class="tick" x1="100" y1="66" x2="100" y2="74"/>
  <line class="tick" x1="380" y1="66" x2="380" y2="74"/>
  <line class="tick" x1="620" y1="66" x2="620" y2="74"/>
  <text class="row" x="20" y="74">sample_clock</text>
  <text class="sub" x="912" y="74">n, never resets</text>

  <text class="row" x="20" y="104">reference</text>
  <text class="sub" x="912" y="98">cos(n · ref_omega),</text>
  <text class="sub" x="912" y="112">the note's pitch</text>
  <g clip-path="url(#buffer)">
    <path class="wave" d="M100,84
      c25.34,0 47.15,7.8 70,16 c22.85,8.2 44.66,16 70,16 c25.34,0 47.15,-7.8 70,-16 c22.85,-8.2 44.66,-16 70,-16
      c25.34,0 47.15,7.8 70,16 c22.85,8.2 44.66,16 70,16 c25.34,0 47.15,-7.8 70,-16 c22.85,-8.2 44.66,-16 70,-16
      c25.34,0 47.15,7.8 70,16 c22.85,8.2 44.66,16 70,16 c25.34,0 47.15,-7.8 70,-16 c22.85,-8.2 44.66,-16 70,-16"/>
    <path class="wave input" d="M100,148
      c21.22,-8.2 41.47,-16 65,-16 c23.53,0 43.78,7.8 65,16 c21.22,8.2 41.47,16 65,16 c23.53,0 43.78,-7.8 65,-16
      c21.22,-8.2 41.47,-16 65,-16 c23.53,0 43.78,7.8 65,16 c21.22,8.2 41.47,16 65,16 c23.53,0 43.78,-7.8 65,-16
      c21.22,-8.2 41.47,-16 65,-16 c23.53,0 43.78,7.8 65,16 c21.22,8.2 41.47,16 65,16 c23.53,0 43.78,-7.8 65,-16
      c21.22,-8.2 41.47,-16 65,-16 c23.53,0 43.78,7.8 65,16 c21.22,8.2 41.47,16 65,16 c23.53,0 43.78,-7.8 65,-16"/>
  </g>
  <text class="row" x="20" y="152">input</text>
  <text class="sub" x="912" y="146">a little sharp, slips</text>
  <text class="sub" x="912" y="160">ahead of the reference</text>

  <!-- Where each window starts on the reference -->
  <line class="start" x1="100" y1="84" x2="100" y2="190"/>
  <line class="start" x1="170" y1="100" x2="170" y2="210"/>
  <line class="start" x1="240" y1="116" x2="240" y2="230"/>
  <line class="start" x1="310" y1="100" x2="310" y2="250"/>
  <line class="start" x1="380" y1="84" x2="380" y2="270"/>
  <circle class="dot" cx="100" cy="84" r="3"/>
  <circle class="dot" cx="170" cy="100" r="3"/>
  <circle class="dot" cx="240" cy="116" r="3"/>
  <circle class="dot" cx="310" cy="100" r="3"/>
  <circle class="dot" cx="380" cy="84" r="3"/>

  <!-- The frame's new samples -->
  <line class="guide" x1="620" y1="62" x2="620" y2="280"/>
  <line class="guide" x1="900" y1="62" x2="900" y2="280"/>

  <!-- One window a hop, gamma shaped toward the newest samples -->
  <text class="row" x="20" y="200">windows</text>
  <rect class="window prev" x="100" y="180" width="520" height="14"/>
  <path class="gamma" d="M100,193 C308,193 386,182 464,182 C542,182 594,190 620,193 Z"/>
  <rect class="window" x="170" y="200" width="520" height="14"/>
  <path class="gamma" d="M170,213 C378,213 456,202 534,202 C612,202 664,210 690,213 Z"/>
  <rect class="window" x="240" y="220" width="520" height="14"/>
  <path class="gamma" d="M240,233 C448,233 526,222 604,222 C682,222 734,230 760,233 Z"/>
  <rect class="window" x="310" y="240" width="520" height="14"/>
  <path class="gamma" d="M310,253 C518,253 596,242 674,242 C752,242 804,250 830,253 Z"/>
  <rect class="window" x="380" y="260" width="520" height="14"/>
  <path class="gamma" d="M380,273 C588,273 666,262 744,262 C822,262 874,270 900,273 Z"/>

  <text class="sub" x="912" y="191">φ0, the previous frame's last</text>
  <text class="sub" x="912" y="211">φ1</text>
  <text class="sub" x="912" y="231">φ2</text>
  <text class="sub" x="912" y="251">φ3</text>
  <text class="sub" x="912" y="271">φ4, the newest, also the amp</text>

  <text class="sub" x="620" y="292" text-anchor="middle">previous frame</text>
  <text class="sub" x="900" y="292" text-anchor="end">newest sample</text>
  <path class="wire" d="M620,302 V308 H900 V302 M690,308 V302 M760,308 V302 M830,308 V302"/>
  <text class="sub" x="655" y="322" text-anchor="middle">hop</text>
  <text class="label" x="110" y="296">each hop: φ = arg( DFT(window) · e^(−i · n_start · ref_omega) )</text>
  <text class="sub" x="110" y="313">the reference at the window's start (the dots) turns the DFT back</text>
  <text class="sub" x="110" y="329">hop = SAMPLERATE / (4 · f), a quarter period, 8 a frame at 110 Hz</text>

  <!-- The advance -->
  <rect class="frame" x="10" y="360" width="1080" height="230"/>
  <path class="frame" d="M10,360 H232 V372 L224,380 H10 Z"/>
  <text class="tab" x="18" y="375">a frame's advance, telescoping</text>

  <!-- φ0..φ4, each against the reference at 0° -->
  <circle class="dial" cx="110" cy="450" r="30"/>
  <line class="zero" x1="140" y1="450" x2="146" y2="450"/>
  <line class="needle" x1="110" y1="450" x2="135.37" y2="440.77"/>

  <circle class="dial" cx="240" cy="450" r="30"/>
  <line class="zero" x1="270" y1="450" x2="276" y2="450"/>
  <line class="ghost" x1="240" y1="450" x2="265.37" y2="440.77"/>
  <line class="needle" x1="240" y1="450" x2="226.5" y2="426.62"/>

  <circle class="dial" cx="370" cy="450" r="30"/>
  <line class="zero" x1="400" y1="450" x2="406" y2="450"/>
  <line class="ghost" x1="370" y1="450" x2="356.5" y2="426.62"/>
  <line class="needle" x1="370" y1="450" x2="349.32" y2="467.36"/>

  <circle class="dial" cx="500" cy="450" r="30"/>
  <line class="zero" x1="530" y1="450" x2="536" y2="450"/>
  <line class="ghost" x1="500" y1="450" x2="479.32" y2="467.36"/>
  <line class="needle" x1="500" y1="450" x2="520.68" y2="467.36"/>

  <circle class="dial" cx="630" cy="450" r="30"/>
  <line class="zero" x1="660" y1="450" x2="666" y2="450"/>
  <line class="ghost" x1="630" y1="450" x2="650.68" y2="467.36"/>
  <line class="needle" x1="630" y1="450" x2="643.5" y2="426.62"/>

  <text class="sub" x="110" y="498" text-anchor="middle">φ0 = 20°</text>
  <text class="sub" x="240" y="498" text-anchor="middle">φ1 = 120°</text>
  <text class="sub" x="370" y="498" text-anchor="middle">φ2 = −140°</text>
  <text class="sub" x="500" y="498" text-anchor="middle">φ3 = −40°</text>
  <text class="sub" x="630" y="498" text-anchor="middle">φ4 = 60°</text>

  <path class="wire" d="M146,430 H204" marker-end="url(#arrow)"/>
  <path class="wire" d="M276,430 H334" marker-end="url(#arrow)"/>
  <path class="wire" d="M406,430 H464" marker-end="url(#arrow)"/>
  <path class="wire" d="M536,430 H594" marker-end="url(#arrow)"/>
  <text class="sub" x="175" y="422" text-anchor="middle">+100°</text>
  <text class="sub" x="305" y="408" text-anchor="middle">crosses ±180°</text>
  <text class="sub" x="305" y="422" text-anchor="middle">+100°, N = 1</text>
  <text class="sub" x="435" y="422" text-anchor="middle">+100°</text>
  <text class="sub" x="565" y="422" text-anchor="middle">+100°</text>

  <!-- Once a frame -->
  <path class="wrong" d="M110,508 Q370,560 622,510" marker-end="url(#arrow-grey)"/>
  <text class="sub" x="370" y="566" text-anchor="middle">once a frame: wrap(φ4 − φ0) = +40°, the full turn is lost and the stripes turn a tenth as fast</text>

  <text class="math" x="710" y="418">advance = Σ wrap(φh − φh−1)</text>
  <text class="math" x="772" y="440">= φ4 − φ0 + 2π · N</text>
  <text class="math" x="772" y="462">= 40° + 360° = 400°</text>
  <text class="sub" x="710" y="492">The inner phases cancel. Every φ is against the same</text>
  <text class="sub" x="710" y="507">reference, so nothing between the frames adds up.</text>
  <text class="sub" x="710" y="530">N counts the full turns: a step that crosses ±180° adds one.</text>
  <text class="sub" x="710" y="545">Each step stays under half a turn up to twice the note's</text>
  <text class="sub" x="710" y="560">frequency off, once a frame only up to 30 Hz at 60 fps.</text>
</svg>
