<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 565" width="1100" height="565" role="img" aria-labelledby="title desc">
  <title id="title">Strobie audio signal path</title>
  <desc id="desc">On the audio thread the input is converted to mono 48 kHz by miniaudio and written into three lock-free ring buffers, one per reader. On the main thread, every display frame: the pitch lane filters its samples, runs the NSDF, picks the peak and holds the target note for 50 ms, which sets the reference frequency of the lock-in and the lamp. The lock-in lane runs a single-bin DFT per track and rotates it by the reference on the sample clock, its phase advance times the track speed turns the strobe tracks, and a least squares fit of the phase gives the cents for the readout and the trace. The lamp lane folds every sample onto two periods of the reference on a fading screen, which the scope view draws as it is and the lamp view from above; a DFT bin of the screen per track can turn the strobe tracks instead of the lock-in.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111; }
    .bg { fill: #fff; }
    .frame, .box, .note { fill: #fff; stroke: #222; stroke-width: 1; }
    .lane { stroke: #999; stroke-width: 1; stroke-dasharray: 4 4; }
    .wire { fill: none; stroke: #222; stroke-width: 1; }
    .dashed { stroke-dasharray: 4 3; }
    .tab { font-size: 12px; font-weight: 600; }
    .lane-name { font-size: 11px; font-style: italic; fill: #666; }
    .title { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; fill: #444; }
    .stereotype { font-size: 10px; fill: #444; }
    .guard { font-size: 11px; fill: #444; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#222" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bg" width="1100" height="565"/>

  <!-- Frames, the threads -->
  <rect class="frame" x="10" y="30" width="190" height="515"/>
  <path class="frame" d="M10,30 H112 V42 L104,50 H10 Z"/>
  <text class="tab" x="18" y="45">audio thread</text>

  <rect class="frame" x="220" y="30" width="870" height="515"/>
  <path class="frame" d="M220,30 H448 V42 L440,50 H220 Z"/>
  <text class="tab" x="228" y="45">main thread, every display frame</text>

  <!-- Lanes -->
  <line class="lane" x1="220" y1="180" x2="1090" y2="180"/>
  <line class="lane" x1="220" y1="355" x2="1090" y2="355"/>
  <text class="lane-name" x="1080" y="68" text-anchor="end">pitch</text>
  <text class="lane-name" x="1080" y="196" text-anchor="end">lock-in</text>
  <text class="lane-name" x="1080" y="372" text-anchor="end">lamp</text>

  <!-- Boxes -->
  <rect class="box" x="30" y="80" width="150" height="56"/>
  <rect class="box" x="30" y="190" width="150" height="56"/>
  <rect class="box" x="30" y="300" width="150" height="70"/>

  <rect class="box" x="240" y="80" width="140" height="56"/>
  <rect class="box" x="410" y="80" width="140" height="56"/>
  <rect class="box" x="580" y="80" width="140" height="56"/>
  <rect class="box" x="750" y="80" width="140" height="56"/>

  <rect class="box" x="240" y="200" width="140" height="56"/>
  <rect class="box" x="410" y="200" width="140" height="56"/>
  <rect class="box" x="580" y="200" width="140" height="56"/>
  <rect class="box" x="920" y="200" width="140" height="56"/>
  <rect class="box" x="580" y="280" width="140" height="56"/>
  <rect class="box" x="920" y="280" width="140" height="56"/>
  <path class="note" d="M240,280 H370 L380,290 V336 H240 Z M370,280 V290 H380"/>

  <rect class="box" x="240" y="390" width="140" height="56"/>
  <rect class="box" x="410" y="390" width="140" height="56"/>
  <rect class="box" x="580" y="390" width="140" height="56"/>
  <rect class="box" x="750" y="390" width="140" height="56"/>
  <rect class="box" x="410" y="470" width="140" height="56"/>
  <rect class="box" x="580" y="470" width="140" height="56"/>

  <!-- Turned by the lock-in or the lamp -->
  <path class="box" d="M820,214 L834,228 L820,242 L806,228 Z"/>

  <!-- Audio thread -->
  <path class="wire" d="M105,136 V190" marker-end="url(#arrow)"/>
  <path class="wire" d="M105,246 V300" marker-end="url(#arrow)"/>

  <!-- One ring buffer per reader -->
  <path class="wire" d="M180,335 H210"/>
  <circle cx="210" cy="335" r="2.5" fill="#222"/>
  <path class="wire" d="M210,335 V108 H240" marker-end="url(#arrow)"/>
  <path class="wire" d="M210,228 H240" marker-end="url(#arrow)"/>
  <path class="wire" d="M210,335 V418 H240" marker-end="url(#arrow)"/>

  <!-- Pitch -->
  <path class="wire" d="M380,108 H410" marker-end="url(#arrow)"/>
  <path class="wire" d="M550,108 H580" marker-end="url(#arrow)"/>
  <path class="wire" d="M720,108 H750" marker-end="url(#arrow)"/>

  <!-- The target note sets the reference of the lock-in and the lamp -->
  <path class="wire" d="M820,136 V168 H310 V200" marker-end="url(#arrow)"/>
  <circle cx="395" cy="168" r="2.5" fill="#222"/>
  <path class="wire" d="M395,168 V375 H480 V390" marker-end="url(#arrow)"/>
  <text class="guard" x="610" y="162" text-anchor="middle">reference frequency, 1× 2× 4× … per track</text>

  <!-- Lock-in -->
  <path class="wire" d="M380,228 H410" marker-end="url(#arrow)"/>
  <path class="wire" d="M550,228 H580" marker-end="url(#arrow)"/>
  <path class="wire" d="M720,228 H806" marker-end="url(#arrow)"/>
  <path class="wire" d="M834,228 H920" marker-end="url(#arrow)"/>
  <path class="wire" d="M650,256 V280" marker-end="url(#arrow)"/>
  <path class="wire" d="M720,308 H920" marker-end="url(#arrow)"/>
  <path class="wire dashed" d="M310,256 V280"/>
  <text class="guard" x="763" y="222" text-anchor="middle">[lock-in]</text>
  <text class="guard" x="820" y="207" text-anchor="middle">turned by</text>

  <!-- Lamp -->
  <path class="wire" d="M380,418 H410" marker-end="url(#arrow)"/>
  <path class="wire" d="M550,418 H580" marker-end="url(#arrow)"/>
  <path class="wire" d="M720,418 H750" marker-end="url(#arrow)"/>
  <path class="wire" d="M820,390 V242" marker-end="url(#arrow)"/>
  <path class="wire" d="M480,446 V470" marker-end="url(#arrow)"/>
  <path class="wire" d="M650,446 V470" marker-end="url(#arrow)"/>
  <text class="guard" x="826" y="370">[lamp]</text>

  <g text-anchor="middle">
    <!-- Audio thread -->
    <text class="title" x="105" y="104">Microphone</text>
    <text class="sub" x="105" y="122">or audio interface</text>

    <text class="title" x="105" y="214">miniaudio</text>
    <text class="sub" x="105" y="232">mono f32, 48 kHz</text>

    <text class="title" x="105" y="324">Ring buffers</text>
    <text class="sub" x="105" y="342">one per reader</text>
    <text class="sub" x="105" y="357">64k samples, lock-free</text>

    <!-- Pitch -->
    <text class="title" x="310" y="102">Filters</text>
    <text class="sub" x="310" y="119">60 Hz high-pass</text>
    <text class="sub" x="310" y="132">5 kHz low-pass</text>

    <text class="title" x="480" y="102">NSDF</text>
    <text class="sub" x="480" y="119">newest 4096 samples</text>
    <text class="sub" x="480" y="132">8192-point FFT</text>

    <text class="title" x="650" y="102">Peak pick</text>
    <text class="sub" x="650" y="119">parabolic peak</text>
    <text class="sub" x="650" y="132">clarity, SNR</text>

    <text class="title" x="820" y="102">Target note</text>
    <text class="sub" x="820" y="119">held for 50 ms</text>
    <text class="sub" x="820" y="132">or the locked note</text>

    <!-- Lock-in -->
    <text class="title" x="310" y="222">Single-bin DFT</text>
    <text class="sub" x="310" y="239">per track, gamma window</text>
    <text class="sub" x="310" y="252">semitone wide, comb</text>

    <text class="title" x="480" y="222">Lock-in</text>
    <text class="sub" x="480" y="239">rotate by the reference</text>
    <text class="sub" x="480" y="252">on the sample clock</text>

    <text class="title" x="650" y="222">Phase advance</text>
    <text class="sub" x="650" y="239">since the last frame</text>
    <text class="sub" x="650" y="252">× track speed</text>

    <text class="title" x="650" y="302">Readout fit</text>
    <text class="sub" x="650" y="319">least squares line</text>
    <text class="sub" x="650" y="332">through the phase</text>

    <text class="title" x="310" y="302">Noise floor per band</text>
    <text class="sub" x="310" y="319">its SNR fades and</text>
    <text class="sub" x="310" y="332">sharpens the stripes</text>

    <text class="stereotype" x="990" y="216">«display»</text>
    <text class="title" x="990" y="233">Strobe tracks</text>
    <text class="sub" x="990" y="249">flat, wheel, curved</text>

    <text class="stereotype" x="990" y="296">«display»</text>
    <text class="title" x="990" y="313">Readout, Trace</text>
    <text class="sub" x="990" y="329">cents per track</text>

    <!-- Lamp -->
    <text class="title" x="310" y="412">AC coupling</text>
    <text class="sub" x="310" y="429">2 Hz, like a scope</text>
    <text class="sub" x="310" y="442">the wave as it is</text>

    <text class="title" x="480" y="412">Fold</text>
    <text class="sub" x="480" y="429">each sample at its phase</text>
    <text class="sub" x="480" y="442">on a fading screen</text>

    <text class="title" x="650" y="412">From above</text>
    <text class="sub" x="650" y="429">the beam's average</text>
    <text class="sub" x="650" y="442">height per column</text>

    <text class="title" x="820" y="412">DFT bin per track</text>
    <text class="sub" x="820" y="429">phase advance</text>
    <text class="sub" x="820" y="442">× track speed</text>

    <text class="stereotype" x="480" y="486">«display»</text>
    <text class="title" x="480" y="503">Scope</text>
    <text class="sub" x="480" y="519">the folded wave</text>

    <text class="stereotype" x="650" y="486">«display»</text>
    <text class="title" x="650" y="503">Lamp</text>
    <text class="sub" x="650" y="519">height as brightness</text>
  </g>
</svg>
